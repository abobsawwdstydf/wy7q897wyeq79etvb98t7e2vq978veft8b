services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexouser
      POSTGRES_PASSWORD: nexopass
      POSTGRES_DB: nexodb
    volumes:
      - nexo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexouser -d nexodb"]
      interval: 5s
      timeout: 3s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: nexo-dragonfly
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      --maxmemory=256mb
      --maxmemory-policy=allkeys-lru
    volumes:
      - nexo-dragonfly-data:/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexo-postgres-data:
  nexo-dragonfly-data:
